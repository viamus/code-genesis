pipeline:
  name: Approval Demo
  description: Demonstrates the approval step — the pipeline pauses and waits for user confirmation.

settings:
  model: claude-haiku-4-5-20251001

steps:
  - name: Generate summary
    description: Produce a short summary that the user will review
    prompt: |
      Write a two-sentence summary explaining what a deployment pipeline does.
      Be concise and clear.
    output_key: summary

  - approval:
      name: Review summary
      message: "The summary above was generated by Claude. Do you want to continue with the next step?"
      display_key: summary

  - name: Final step
    description: Runs only if the user approved
    prompt: |
      Say "Deployment approved and pipeline completed successfully!" in a cheerful tone.
