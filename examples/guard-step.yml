pipeline:
  name: "Guard Step Demo"
  description: "Demonstrates using a guard step to validate a collection before foreach"
  version: "1.0"

settings:
  model: "claude-sonnet-4-6"
  max_turns: 3

inputs:
  modules:
    description: "Comma-separated list of modules to process"
    default: "auth,api,database"

steps:
  # Step 1: Ask the LLM to produce a module list
  - name: "List modules"
    prompt: |
      Return ONLY a JSON array of module names from this list: {{modules}}
      Example: ["auth","api","database"]
      Return ONLY the JSON array, nothing else.
    max_turns: 1
    output_key: "module_list"

  # Step 2: Guard — validate the collection before iterating.
  # If the list is empty or contains blank entries, the pipeline
  # stops here with a clear error instead of running an empty foreach.
  - guard:
      collection: "{{steps.module_list}}"
      error_message: "Module list is empty or contains invalid entries — nothing to process"

  # Step 3: Foreach — safe to iterate, the guard guarantees valid items
  - foreach:
      collection: "{{steps.module_list}}"
      item_var: "module"
      output_key: "module_results"
      steps:
        - name: "Process {{module}}"
          prompt: |
            Describe the responsibilities of a typical "{{module}}" module
            in a web application. Keep it to 2-3 sentences.
          max_turns: 1
          output_key: "description"

  # Step 4: Summarize
  - name: "Summarize"
    prompt: |
      Summarize the following module descriptions:
      {{steps.module_results}}

      Provide a brief overall summary.
    max_turns: 1
    output_key: "summary"

outputs:
  summary:
    source: "steps.summary"
    description: "Overall module summary"
